name: Generate Pacman Game

on:
  schedule:
    - cron: "0 0 * * *" # Tự động chạy mỗi ngày
  workflow_dispatch: # Cho phép bấm chạy thủ công bất cứ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # Tạo file SVG game Pac-Man từ đóng góp của bạn
      - uses: abozanona/pacman-contribution-graph@prod
        with:
          github_user_name: BuiBuiBii
          game_name: pacman 
          
      # Đẩy file ảnh SVG game lên nhánh "output" để hiển thị
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
