name: Generate Pacman Game

on:
  schedule:
    - cron: "0 0 * * *" # Tự động chạy mỗi ngày
  workflow_dispatch: # Cho phép bấm chạy thủ công bất cứ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v3
      
      # Tạo file SVG game Pac-Man (Dùng bản @main chuẩn)
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: BuiBuiBii
          games: 'pacman' # Các game hỗ trợ: pacman, breakout, galaga, puzzle-bobble, bomberman, minesweeper
          
      # Đẩy file ảnh SVG game lên nhánh "output" để hiển thị
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
